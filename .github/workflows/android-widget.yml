name: APK do widget de registro rápido
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android-widget/**"
      - ".github/workflows/android-widget.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon -p android-widget :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: semana-registro-rapido-apk
          path: android-widget/app/build/outputs/apk/debug/app-debug.apk
